limit_req_zone $binary_remote_addr zone=messageq_requests:10m rate=10r/s;
map $status $messageq_retry_after {
    default "";
    429 "5";
}

server {
    listen 80;
    server_name 143.110.253.222;
    location /.well-known/acme-challenge/ {
        root /workspaces/messageq/.runtime/acme;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 143.110.253.222;
    server_tokens off;
    ssl_certificate /workspaces/messageq/.runtime/certbot/live/143.110.253.222/fullchain.pem;
    ssl_certificate_key /workspaces/messageq/.runtime/certbot/live/143.110.253.222/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=3600" always;
    add_header Retry-After $messageq_retry_after always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    client_max_body_size 1m;

    location / {
        limit_req zone=messageq_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
