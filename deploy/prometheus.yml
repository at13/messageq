global:
  scrape_interval: 15s
rule_files:
  - /workspaces/messageq/deploy/alerts.yml
scrape_configs:
  - job_name: messageq
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /workspaces/messageq/.runtime/api-token
    static_configs:
      - targets: ['127.0.0.1:3000']
